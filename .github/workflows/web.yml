name: Website

# Cloudflare Workers Builds deploys the site, so this only checks that it builds.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:worker
      - name: Worker tests
        run: npm test
      - name: Admin CLI
        working-directory: web/cli
        run: |
          npm ci
          npx tsc --noEmit
          npm test
