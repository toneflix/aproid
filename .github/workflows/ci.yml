name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol tests
        run: ./gradlew :protocol:test
      - name: Build app
        run: ./gradlew :app:assembleDebug

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Protocol tests
        run: dotnet test tests/Aproid.Core.Tests
      - name: Build app
        run: dotnet publish src/Aproid -c Release -r win-x64 -p:Platform=x64 --self-contained true -o publish/Aproid
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Aproid-windows-x64
          path: windows/publish/Aproid
