name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Protocol tests
        run: ./gradlew :protocol:test
      - name: Build app
        run: ./gradlew :app:assembleDebug

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v7
      # Liquid Glass needs the macOS 26 SDK, so build with Xcode 26 when the runner has it.
      - name: Pick Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Protocol tests
        run: dotnet test tests/Aproid.Core.Tests
      - name: Build app and installer
        run: ./scripts/package.ps1
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Aproid-windows-x64
          path: windows/publish/Aproid
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Aproid-windows-setup
          path: windows/publish/Aproid-Setup-*.exe
