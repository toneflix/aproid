name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocol tests
        run: ./gradlew :protocol:test
      - name: Build app
        run: ./gradlew :app:assembleDebug

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      # Liquid Glass needs the macOS 26 SDK, so build with Xcode 26 when the runner has it.
      - name: Pick Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
