name: Release

# Tag a version as 1.2.3 to build all three apps and publish them together as one GitHub release,
# or as android-1.2.3, macos-1.2.3 or windows-1.2.3 to release just that app:
#   FlyyLink-1.2.3.apk / .aab   signed Android app and Play Store bundle
#   FlyyLink-1.2.3.dmg / .zip   signed, notarized Mac app and its update zip
#   FlyyLink-Setup-1.2.3.exe    Windows installer
# Nothing is published unless every app in the release builds.
#
# The Android build number is the base in version.json plus this workflow's run number, and the
# version name can't be lower than the base there.
#
# Android secrets: ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# and ANDROID_KEY_PASSWORD when the key has its own password.
#
# Mac secrets: MACOS_CERT_P12 (base64 Developer ID Application .p12), MACOS_CERT_PASSWORD,
# NOTARY_KEY (App Store Connect API .p8 contents), NOTARY_KEY_ID, NOTARY_ISSUER_ID, SPARKLE_PRIVATE_KEY.
# Mac variable: SPARKLE_PUBLIC_KEY. Without the Sparkle key and variable, the release works but can't auto-update.
#
# Website secrets: CLOUDFLARE_API_TOKEN (with R2 edit access) and CLOUDFLARE_ACCOUNT_ID. Every file is uploaded
# to the flyylink-releases bucket, which the website serves at /download/<platform> and /releases/<file>.
# The Mac app reads its update feed from /updates/mac/appcast.xml and the Windows app from /updates/windows.json.
# Builds from before the move still read the GitHub releases, so those are published too.
# Digits after the prefix keep the macos-appcast tag from starting a release.
on:
  push:
    tags:
      [
        '[0-9]*',
        'v[0-9]*',
        'android-[0-9v]*',
        'macos-[0-9v]*',
        'windows-[0-9v]*',
      ]

permissions:
  contents: write

env:
  SITE_URL: https://flyylink.toneflix.net

jobs:
  android:
    if: ${{ !startsWith(github.ref_name, 'macos-') && !startsWith(github.ref_name, 'windows-') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Protocol tests
        run: ./gradlew :protocol:test
      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#android-}"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Load the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets first."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build and sign
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease -PversionName="$VERSION" -PbuildNumber=${{ github.run_number }}
          rm "$ANDROID_KEYSTORE_FILE"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FlyyLink-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/FlyyLink-$VERSION.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android/dist/

  macos:
    if: ${{ !startsWith(github.ref_name, 'android-') && !startsWith(github.ref_name, 'windows-') }}
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
      LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Pick Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          swift --version
      - name: Test
        run: swift test
      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#macos-}"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Load the signing certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::error::Add the MACOS_CERT_P12 and MACOS_CERT_PASSWORD secrets first."
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::The certificate isn't a Developer ID Application certificate."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          VERSION: ${{ steps.version.outputs.number }}
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ] && [ -n "$SPARKLE_PUBLIC_KEY" ]; then
            export SPARKLE_FEED_URL="$SITE_URL/updates/mac/appcast.xml"
          else
            echo "::warning::No Sparkle key, so this build won't update itself."
          fi
          ./scripts/bundle.sh release

      - name: Notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.number }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" > "$key"
          notarize() {
            xcrun notarytool submit "$1" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 30m
          }

          # The app first, so the copy inside the disk image and the update zip carry the ticket.
          ditto -c -k --keepParent build/FlyyLink.app "$RUNNER_TEMP/notarize.zip"
          notarize "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple build/FlyyLink.app

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/FlyyLink.app "dist/FlyyLink-$VERSION.zip"

          # A disk image with a shortcut to Applications, for first installs.
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto build/FlyyLink.app "$stage/FlyyLink.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname FlyyLink -srcfolder "$stage" -ov -format UDZO "dist/FlyyLink-$VERSION.dmg"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp "dist/FlyyLink-$VERSION.dmg"
          notarize "dist/FlyyLink-$VERSION.dmg"
          xcrun stapler staple "dist/FlyyLink-$VERSION.dmg"
          rm "$key"

      - name: Write the update feed
        if: env.SPARKLE_PRIVATE_KEY != '' && env.SPARKLE_PUBLIC_KEY != ''
        env:
          VERSION: ${{ steps.version.outputs.number }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          # Prints: sparkle:edSignature="..." length="..."
          signature=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$RUNNER_TEMP/sparkle.key" "dist/FlyyLink-$VERSION.zip")
          rm "$RUNNER_TEMP/sparkle.key"
          url="$SITE_URL/releases/FlyyLink-$VERSION.zip"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>FlyyLink</title>
              <item>
                <title>FlyyLink $VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <link>$SITE_URL/#download</link>
                <enclosure url="$url" type="application/octet-stream" $signature />
              </item>
            </channel>
          </rss>
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: macos/dist/

  windows:
    if: ${{ !startsWith(github.ref_name, 'android-') && !startsWith(github.ref_name, 'macos-') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Protocol tests
        run: dotnet test tests/FlyyLink.Core.Tests
      - name: Read the version from the tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#windows-}"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build app and installer
        env:
          LICENCE_PUBLIC_KEY: ${{ vars.LICENCE_PUBLIC_KEY }}
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.number }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/publish/FlyyLink-Setup-*.exe

  # Skipped apps are fine; a failed or cancelled one stops the release.
  publish:
    needs: [android, macos, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Name the release
        id: name
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            android-*) app=" for Android"; tag="${tag#android-}" ;;
            macos-*) app=" for Mac"; tag="${tag#macos-}" ;;
            windows-*) app=" for Windows"; tag="${tag#windows-}" ;;
          esac
          echo "title=FlyyLink$app ${tag#v}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.name.outputs.title }}
          files: |
            dist/FlyyLink-*.apk
            dist/FlyyLink-*.aab
            dist/FlyyLink-*.dmg
            dist/FlyyLink-*.zip
            dist/FlyyLink-Setup-*.exe
          generate_release_notes: true

      # One fixed release holds the Mac feed, so the app's feed address never changes.
      - name: Publish Mac update feed
        if: hashFiles('dist/appcast.xml') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: macos-appcast
          name: Mac update feed
          body: FlyyLink for Mac checks this feed for updates. Don't delete it.
          prerelease: true
          files: dist/appcast.xml

      - name: Publish downloads to the website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first."
            exit 1
          fi

          r2() { npx --yes wrangler@4 r2 object "$@" --remote; }
          put() { r2 put "flyylink-releases/$1" --file "$2"; }

          r2 get flyylink-releases/latest.json --file latest.json || echo '{}' > latest.json

          record() {
            jq --arg p "$1" --arg v "$VERSION" --arg d "$2" --arg u "${3:-}" \
              '.[$p] = ({version: $v, download: $d} + (if $u == "" then {} else {update: $u} end))' \
              latest.json > latest.next && mv latest.next latest.json
          }

          for file in dist/FlyyLink-*.apk dist/FlyyLink-*.dmg dist/FlyyLink-*.zip dist/FlyyLink-Setup-*.exe; do
            [ -f "$file" ] || continue
            put "releases/$(basename "$file")" "$file"
          done

          [ -f "dist/FlyyLink-$VERSION.apk" ] && record android "FlyyLink-$VERSION.apk"
          [ -f "dist/FlyyLink-$VERSION.dmg" ] && record mac "FlyyLink-$VERSION.dmg" "FlyyLink-$VERSION.zip"
          [ -f "dist/FlyyLink-Setup-$VERSION.exe" ] && record windows "FlyyLink-Setup-$VERSION.exe"

          # The feed goes up after the files it points to, and the download links last.
          if [ -f dist/appcast.xml ]; then
            put updates/appcast.xml dist/appcast.xml
          fi
          put latest.json latest.json
